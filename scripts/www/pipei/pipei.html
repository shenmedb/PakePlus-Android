<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>海岛匹配</title>
<style>
    * {margin:0;padding:0;box-sizing:border-box;}
    body {padding:20px;background:#fff;padding-bottom:80px;}
    .title {text-align:center;font-size:24px;margin-bottom:10px;color:#000;}

    .container {
        display:grid;
        grid-template-columns:repeat(2,1fr);
        gap:40px 20px;
        max-width:700px;
        margin:0 auto 40px;
    }
    .card-wrap {width:100%;position:relative;}
    .card-title {text-align:center;color:#000;font-size:16px;margin-bottom:12px;}
    .wheel-box {position:relative;width:100%;height:auto;}
    .wheel-box img {width:100%;display:block;}
    .wheel-grid {
        position:absolute;top:0;left:0;
        width:100%;height:100%;
        display:grid;
        grid-template-columns:repeat(8,1fr);
        grid-template-rows:repeat(8,1fr);
        pointer-events:none;
    }
    .sector-text {
        color:#fff;
        font-size:12px;
        font-weight:bold;
        display:flex;
        justify-content:center;
        align-items:center;
        text-align:center;
        white-space:pre-wrap;
    }
    .w1-1,.w2-1,.w3-1,.w4-1 {grid-area:1/3/3/7;}
    .w1-2,.w2-2,.w3-2,.w4-2 {grid-area:2/6/4/8;}
    .w1-3,.w2-3,.w3-3,.w4-3 {grid-area:4/6/6/9;}
    .w1-4,.w2-4,.w3-4,.w4-4 {grid-area:5/6/9/8;}
    .w1-5,.w2-5,.w3-5,.w4-5 {grid-area:7/3/9/7;}
    .w1-6,.w2-6,.w3-6,.w4-6 {grid-area:5/1/9/5;}
    .w1-7,.w2-7,.w3-7,.w4-7 {grid-area:4/1/6/4;}
    .w1-8,.w2-8,.w3-8,.w4-8 {grid-area:2/1/4/5;}

.flow-footer {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 30px;
      padding-bottom: 10px;
      line-height: 1.4;
}
.flow-line {
      height: 15px;
      line-height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
}
.flow-line a {
      color: #999 !important;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
}
.flow-line img {
      width: 13px;
      height: 13px;
      display: block;
}

    .back-home {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 999;
        padding: 9px 26px;
        border-radius: 999px;
        background: rgba(255,255,255,0.75);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1.5px solid #000;
        font-size: 14px;
        color: #000;
        text-decoration: none;
        font-weight: 500;
    }

    @media (max-width: 480px) {
        body { padding: 10px; padding-bottom:70px; }
        .title { font-size: 20px; }
        .container {
            grid-template-columns: 1fr;
            gap: 25px 0;
        }
        .card-title { font-size: 14px; margin-bottom: 8px; }
        .sector-text { font-size: 14px; }
        .back-home {
            padding: 8px 15px;
            font-size: 15px;
            left: 12px;
            bottom: 12px;
        }
    }
</style>
</head>
<body>

<h1 class="title">海岛匹配</h1>
<div class="container">

<div class="card-wrap">
    <div class="card-title">图一</div>
    <div class="wheel-box">
        <img src="/pipei/haidao.webp" alt="">
        <div class="wheel-grid">
            <div class="sector-text w1-1" id="w1-1"></div>
            <div class="sector-text w1-2" id="w1-2"></div>
            <div class="sector-text w1-3" id="w1-3"></div>
            <div class="sector-text w1-4" id="w1-4"></div>
            <div class="sector-text w1-5" id="w1-5"></div>
            <div class="sector-text w1-6" id="w1-6"></div>
            <div class="sector-text w1-7" id="w1-7"></div>
            <div class="sector-text w1-8" id="w1-8"></div>
        </div>
    </div>
</div>

<div class="card-wrap">
    <div class="card-title">图二</div>
    <div class="wheel-box"><img src="/pipei/haidao.webp" alt="">
        <div class="wheel-grid">
            <div class="sector-text w2-1" id="w2-1"></div>
            <div class="sector-text w2-2" id="w2-2"></div>
            <div class="sector-text w2-3" id="w2-3"></div>
            <div class="sector-text w2-4" id="w2-4"></div>
            <div class="sector-text w2-5" id="w2-5"></div>
            <div class="sector-text w2-6" id="w2-6"></div>
            <div class="sector-text w2-7" id="w2-7"></div>
            <div class="sector-text w2-8" id="w2-8"></div>
        </div>
    </div>
</div>

<div class="card-wrap">
    <div class="card-title">图三</div>
    <div class="wheel-box"><img src="/pipei/haidao.webp" alt="">
        <div class="wheel-grid">
            <div class="sector-text w3-1" id="w3-1"></div>
            <div class="sector-text w3-2" id="w3-2"></div>
            <div class="sector-text w3-3" id="w3-3"></div>
            <div class="sector-text w3-4" id="w3-4"></div>
            <div class="sector-text w3-5" id="w3-5"></div>
            <div class="sector-text w3-6" id="w3-6"></div>
            <div class="sector-text w3-7" id="w3-7"></div>
            <div class="sector-text w3-8" id="w3-8"></div>

    </div>
</div>

<div class="card-wrap">
    <div class="card-title">图四</div>

        <div class="wheel-grid">
            <div class="sector-text w4-1" id="w4-1"></div>

            <div class="sector-text w4-4" id="w4-4"></div>
            <div class="sector-text w4-5" id="w4-5"></div>

            <div class="sector-text w4-8" id="w4-8"></div>
        </div>
    </div>
</div>

</div>

<div class="flow-footer">

</div>

<a href="/" class="back-home">返回主页</a>

<script>
fetch("config.json?t=" + new Date().getTime())
.then(res => res.json())
.then(data => {
    function show(wheelId, list) {
        for (let i = 0; i < 8; i++) {
            let el = document.getElementById(`${wheelId}-${i+1}`);
            if (!el) continue;
            let txt = list[i] || "";
            el.innerHTML = txt.replace(/\|/g, "<br>");
        }
    }
show("w1", data.wheel1 || []);
show("w2", data.wheel2 || []);
show("w3", data.wheel3 || []);
show("w4", data.wheel4 || []);
});
</script>
</body>
</html>
