<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>经典战役 - 起源联盟</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: "Microsoft YaHei", sans-serif;
    overflow: hidden;
}

.swiper-container {
    width: 100%;
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
}
.swiper-container::-webkit-scrollbar {
    display: none;
}

.video-slide {
    width: 100%;
    height: 100vh;
    scroll-snap-align: start;
    position: relative;
}

.video-box {
    width: 100%;
    height: 100%;
}
.video-box video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

.back-btn {
    position: fixed;
    left: 20px;
    bottom: 20px;
    background: rgba(0,0,0,0.5);
    border: 1.5px solid #ffdd40;
    color: #ffdd40;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: bold;
    z-index: 999;
}

.flow-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    padding: 6px 0 10px;
    background: linear-gradient(transparent, #000 80%);
    z-index: 99;
}
.flow-line {
    line-height: 1.4;
}
.flow-line a {
    color: #fff;
    text-decoration: none;
}
.flow-line img {
    width: 12px;
    vertical-align: middle;
}
</style>
</head>

<body>

<button class="back-btn" onclick="location.href='hd.html'">海岛联盟</button>

<div class="swiper-container">
    <div class="video-slide">
        <div class="video-box">
            <video controls loop playsinline>
                <source src="/haidaozhanyi/hd.mp4" type="video/mp4">
                浏览器不支持视频播放
            </video>
        </div>
    </div>

    <div class="video-slide">
        <div class="video-box">
            <video controls loop playsinline>
                <source src="/haidaozhanyi/hd2.mp4" type="video/mp4">
                浏览器不支持视频播放
            </video>
        </div>
    </div>
</div>

<div class="flow-footer">
  <div class="flow-line">本站内容仅供娱乐交流使用，禁止商用</div>
  <div class="flow-line">© 2026 起源联盟 版权所有</div>
  <div class="flow-line">
    <a href="https://beian.miit.gov.cn/" target="_blank">
      <img src="foot-icp.png" alt="备案">
      浙ICP备2026025846号-1
    </a>
  </div>
  <div class="flow-line">
    <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=33052202000916" target="_blank">
      <img src="foot-gongan.png" alt="公安备案">
      浙公网安备33052202000916号
    </a>
  </div>
</div>

<script>
const container = document.querySelector('.swiper-container');
container.addEventListener('scroll', () => {
    let index = Math.round(container.scrollTop / window.innerHeight);
    document.querySelectorAll('video').forEach((v, i) => {
        i === index ? v.play() : v.pause();
    });
});
</script>

</body>
</html>
