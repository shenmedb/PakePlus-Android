<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联盟福利抽奖</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: sans-serif;
}
body {
    background-color: #000;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
}
.page-title {
    font-size: 2rem;
    color: #ffcc00;
    font-weight: bold;
    margin-bottom: 30px;
    text-align: center;
}
.lottery-container {
    background-color: #1a1a1a;
    border-radius: 16px;
    padding: 25px;
    width: 100%;
    max-width: 500px;
    border: 1px solid #333;
    margin-bottom: 25px;
}
.lottery-title {
    font-size: 1.5rem;
    color: #ffcc00;
    text-align: center;
    margin-bottom: 20px;
}

.wheel-wrap {
    position: relative;
    width: 85%;
    margin: 0 auto 15px;
}
.pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 30px solid #ffcc00;
    z-index: 10;
}

.prize-wheel {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    position: relative;
    background: conic-gradient(
        #ffcc00 0deg 45deg,
        #e63946 45deg 90deg,
        #457b9d 90deg 135deg,
        #2a9d8f 135deg 180deg,
        #f4a261 180deg 225deg,
        #9d4edd 225deg 270deg,
        #3a0ca3 270deg 315deg,
        #222 315deg 360deg
    );
    box-shadow: 0 0 20px rgba(255,204,0,0.35);
    transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.arc-text {
    position: absolute;
    left: 50%;
    top: 0;
    width: 50%;
    height: 50%;
    transform-origin: center bottom;
    text-align: center;
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    padding-top: 6%;
}
.arc-text:nth-child(1) { transform: translateX(-50%) rotate(22.5deg); }
.arc-text:nth-child(2) { transform: translateX(-50%) rotate(67.5deg); }
.arc-text:nth-child(3) { transform: translateX(-50%) rotate(112.5deg); }
.arc-text:nth-child(4) { transform: translateX(-50%) rotate(157.5deg); }
.arc-text:nth-child(5) { transform: translateX(-50%) rotate(202.5deg); }
.arc-text:nth-child(6) { transform: translateX(-50%) rotate(247.5deg); }
.arc-text:nth-child(7) { transform: translateX(-50%) rotate(292.5deg); }
.arc-text:nth-child(8) { transform: translateX(-50%) rotate(337.5deg); }

.wheel-center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 22%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 50%;
    border: 3px solid #ffcc00;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffcc00;
    font-weight: bold;
    z-index:2;
}

.result-text {
    text-align: center;
    margin-bottom: 20px;
    color: #ffcc00;
    font-size: 1.05rem;
    min-height:24px;
}

.form-group {
    margin-bottom: 16px;
}
.form-group label {
    display: block;
    color: #ccc;
    margin-bottom: 6px;
}
.form-group input {
    width: 100%;
    padding: 12px;
    background: #2a2a2a;
    border: 1px solid #444;
    border-radius: 6px;
    color: #fff;
}
.btn {
    width: 100%;
    padding: 14px;
    background: #ffcc00;
    color: #000;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    font-size: 1.1rem;
    margin-top: 8px;
    cursor: pointer;
}
.btn-view {
    width: 100%;
    padding: 12px;
    background: #0099ff;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    margin-top: 8px;
    cursor: pointer;
}
.btn-back {
    width: 100%;
    padding: 12px;
    background: #666;
    color: #fff;
    font-weight: bold;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    margin-top: 12px;
    cursor: pointer;
}
.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
.btn:active,.btn-back:active,.btn-view:active {
    transform: scale(0.98);
}

.modal {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal.show {
    display: flex;
}
.modal-box {
    background: #1a1a1a;
    border: 1px solid #ffcc00;
    border-radius: 12px;
    width: 100%; max-width: 500px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
}
.modal-title {
    color: #ffcc00;
    text-align: center;
    margin-bottom: 15px;
    font-size: 1.2rem;
}
.prize-item {
    padding: 10px;
    border-bottom: 1px solid #333;
    font-size: 14px;
}
.prize-item .name {
    color: #ffcc00;
    font-weight: bold;
}
.prize-item .prize {
    color: #fff;
    margin-left: 10px;
}
.prize-item .time {
    color: #888;
    font-size: 12px;
    margin-top: 4px;
}
.close-modal {
    text-align: center;
    margin-top: 15px;
    padding: 10px;
    background: #666;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
}

.flow-footer {
  text-align: center;
  color: #fff;
  font-size: 12px;
  margin-top: 30px;
  padding-bottom: 10px;
  line-height: 1.4;
}
.flow-line {
  height: 15px;
  line-height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.flow-line a {
  color: #fff !important;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.flow-line img {
  width: 13px;
  height: 13px;
  display: block;
}
</style>
</head>
<body>

<h1 class="page-title">联盟福利抽奖</h1>
<div class="lottery-container">
    <h2 class="lottery-title">幸运大转盘</h2>

    <div class="wheel-wrap">
        <div class="pointer"></div>
        <div class="prize-wheel" id="wheel">
            <div class="arc-text">完美幻凯</div>
            <div class="arc-text">家园管家</div>
            <div class="arc-text">免广会员</div>
            <div class="arc-text">农场特权</div>
            <div class="arc-text">普通会员</div>
            <div class="arc-text">谢谢参与</div>
            <div class="arc-text">谢谢参与</div>
            <div class="arc-text">谢谢参与</div>
        </div>
        <div class="wheel-center">抽奖</div>
    </div>

    <div class="result-text" id="result"></div>

    <div class="form-group">
        <label>游戏角色名</label>
        <input type="text" id="gameName" placeholder="请输入角色名">
    </div>
    <div class="form-group">
        <label>所在联盟</label>
        <input type="text" id="allianceName" placeholder="请输入联盟">
    </div>

    <button class="btn" id="startBtn">立即抽奖</button>
    <button class="btn-view" id="viewPrizeBtn">中奖查看</button>
    <button class="btn-back" id="backHomeBtn">返回主页</button>
</div>

<div class="modal" id="prizeModal">
    <div class="modal-box">
        <div class="modal-title">最新中奖名单</div>
        <div id="prizeList"></div>
        <div class="close-modal" id="closeModal">关闭</div>
    </div>
</div>

<div class="flow-footer">
  <div class="flow-line">本站内容仅供娱乐交流使用，禁止商用</div>
  <div class="flow-line">© 2026 起源联盟 版权所有</div>
  <div class="flow-line">
    <a href="https://beian.miit.gov.cn/" target="_blank">
      <img src="foot-icp.png" alt="备案">
      浙ICP备2026025846号-1
    </a>
  </div>
  <div class="flow-line">
    <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=33052202000916" target="_blank">
      <img src="foot-gongan.png" alt="公安备案">
      浙公网安备33052202000916号
    </a>
  </div>
</div>

<script>
const wheel = document.getElementById('wheel');
const startBtn = document.getElementById('startBtn');
const resultText = document.getElementById('result');
const viewPrizeBtn = document.getElementById('viewPrizeBtn');
const prizeModal = document.getElementById('prizeModal');
const prizeList = document.getElementById('prizeList');
const closeModal = document.getElementById('closeModal');

const prizeListArr = [
    "一等奖：完美幻凯",
    "二等奖：家园管家",
    "三等奖：免广会员",
    "四等奖：农场特权",
    "五等奖：普通会员",
    "参与奖：谢谢参与",
    "参与奖：谢谢参与",
    "参与奖：谢谢参与"
];

const weight = [0.01, 0.01, 0.01, 0.01, 0.01, 20, 20, 20];
const sectorAngle = 45;
let isRunning = false;

async function checkLotteryLimit(name) {
    try {
        const res = await fetch('check_limit.php?name=' + encodeURIComponent(name));
        const txt = await res.text();
        return txt === 'yes';
    } catch (err) {
        return false;
    }
}

viewPrizeBtn.onclick = function(){
    fetch('get_prizes.php')
    .then(res=>res.json())
    .then(data=>{
        let html = '';
        data.forEach(item=>{
            html += `
            <div class="prize-item">
                <span class="name">${item.gameName}</span>
                <span class="prize">${item.prize}</span>
                <div class="time">${item.addtime}</div>
            </div>
            `;
        });
        prizeList.innerHTML = html;
        prizeModal.classList.add('show');
    });
}
closeModal.onclick = function(){
    prizeModal.classList.remove('show');
}

startBtn.onclick = async function () {
    if (isRunning) return;

    let name = document.getElementById('gameName').value.trim();
    let alliance = document.getElementById('allianceName').value.trim();
    
    if (!name || !alliance) {
        resultText.innerText = "请完善角色和联盟信息！";
        return;
    }

    const hasLimit = await checkLotteryLimit(name);
    if (hasLimit) {
        resultText.innerText = "❌ 你今天已经抽过奖了，明天再来！";
        startBtn.disabled = true;
        return;
    }

    let totalWeight = weight.reduce((a, b) => a + b, 0);
    let randomVal = Math.random() * totalWeight;
    let randomIdx = 0;
    let current = 0;
    for (let i = 0; i < weight.length; i++) {
        current += weight[i];
        if (randomVal < current) {
            randomIdx = i;
            break;
        }
    }

    isRunning = true;
    resultText.innerText = "抽奖中...";

    wheel.style.transition = 'none';
    wheel.style.transform = 'rotate(0deg)';
    void wheel.offsetWidth;

    wheel.style.transition = 'transform 4s cubic-bezier(0.2, 0.8, 0.2, 1)';
    let targetAngle = 360 * 5 + sectorAngle * (7 - randomIdx) + 22.5;
    wheel.style.transform = `rotate(${targetAngle}deg)`;

    setTimeout(async () => {
        let getPrize = prizeListArr[randomIdx];
        resultText.innerText = `恭喜获得：${getPrize}`;
        isRunning = false;
        startBtn.disabled = true;

        await fetch('save_lottery.php', {
            method: 'POST',
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `gameName=${encodeURIComponent(name)}&allianceName=${encodeURIComponent(alliance)}&prize=${encodeURIComponent(getPrize)}`
        });

    }, 4000);
}

document.getElementById('backHomeBtn').onclick = function () {
    location.href = '/index.html';
};
</script>
</body>
</html>
